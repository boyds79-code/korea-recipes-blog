name: Daily recipe draft

on:
  schedule:
    # 매일 00:00 UTC = 08:00 Asia/Manila. 시간을 바꾸려면 이 cron 값을 수정하세요.
    - cron: '0 0 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  workflows: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 기본 GITHUB_TOKEN은 .github/workflows/ 파일이 포함된 브랜치를 절대 못 올립니다
          # (GitHub의 하드코딩된 제한이라 permissions 블록으로도 못 풀어요) — 그래서
          # 'workflow' 권한이 있는 개인 액세스 토큰(PAT_TOKEN)을 대신 씁니다.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate recipe draft (+ AI images if GEMINI_API_KEY is set)
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: npm run generate

      - name: Open pull request for human review
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "New recipe draft: ${{ env.POST_TITLE }}"
          branch: "draft/${{ env.POST_SLUG }}"
          delete-branch: true
          title: "🍲 Draft: ${{ env.POST_TITLE }}"
          labels: draft-post
          body: |
            Auto-generated recipe draft, ready for human review.

            - **Queue tier:** `${{ env.TOPIC_SOURCE }}`
            - **File:** `src/content/blog/${{ env.POST_SLUG }}.md`

            **Before merging:**
            1. Read the recipe steps for accuracy — check quantities, timing, and technique make sense.
            2. Check the ingredient list is complete and matches what the steps actually use.
            3. Make sure it reads like a real, useful recipe rather than generic filler.
            4. **Check the two images.** If `GEMINI_API_KEY` is configured, `finished.jpg` and
               `ingredients.jpg` are already auto-generated and committed to this branch — just
               look them over in the "Files changed" tab. If either is missing (Gemini can fail
               per-image), the top of the changed `.md` file has an HTML comment with a ready-to-
               use AI image prompt for it. Copy the prompt into
               https://www.bing.com/images/create (free), save the result with the exact filename,
               and add it to `public/images/blog/<slug>/` on this branch.
            5. Merge this PR to publish (Vercel will auto-deploy on merge to `main`).

            If the queue runs out, this workflow will fail with a clear message —
            add more entries to `topics/queue.yaml` when that happens.
